[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-dungeon-slaughter"
version = "0.1.0"
description = "Super Dungeon Slaughter - A text-based dungeon crawler RPG"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff",
    "isort",
]

[project.scripts]
dungeon = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
